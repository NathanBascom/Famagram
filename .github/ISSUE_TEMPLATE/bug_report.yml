name: Bug report
description: Something isn't working as expected in a Famagram deployment
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! For a **security
        vulnerability**, please use [private reporting](https://github.com/NathanBascom/Famagram/security/advisories/new)
        instead of this form.

  - type: dropdown
    id: deployment-method
    attributes:
      label: Deployment method
      options:
        - docker-compose.deploy.yml (standard .env)
        - docker-compose.vault.yml (HashiCorp Vault)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Image tag / version
      description: Run `docker compose images` or check Admin Panel > Settings
      placeholder: e.g. v1.5.0 or latest
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        `docker compose logs -f <service>` output, if relevant.
        **Redact anything sensitive** — `.env` values, session cookies, email addresses, etc.
      render: shell
    validations:
      required: false

  - type: input
    id: platform
    attributes:
      label: Host platform
      placeholder: e.g. Raspberry Pi 4 / Synology NAS / Ubuntu VPS / Mac (Docker Desktop)
    validations:
      required: false
